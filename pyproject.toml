[project]
name = "mitra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets~=3.6",
    "einops>=0.8.1",
    "fasttext>=0.9.3",
    "huggingface-hub[cli]>=0.35.3",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "kaleido>=1.2.0",
    "nbformat>=4.2.0",
    "nnsight>=0.5.9",
    "plotly>=6.3.1",
    "protobuf>=4.24.4,<5.0.0",
    "sacrebleu>=2.5.1",
    "sentencepiece>=0.2.1",
    "slurmtui>=0.4.0",
    "tokenizers>=0.21",
    "torch>=2.8.0",
    "transformers>=4.53.3",
    "unbabel-comet>=2.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "ruff>=0.14.2",
]
